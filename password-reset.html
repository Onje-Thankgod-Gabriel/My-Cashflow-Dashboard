<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabsweb CashFlow - Reset Password</title>
    <link rel="icon" href="assets/images/fav.png" />
    <script src="https://unpkg.com/lucide@1.64.0/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="assets/css/index.css" rel="stylesheet" />
    <link href="assets/css/auth.css" rel="stylesheet" />
      <link href="assets/css/typography.css" rel="stylesheet" />
  </head>
  <body class="auth-page flex items-center justify-center relative">
    <button id="theme-toggle" class="auth-theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false"><i data-lucide="sun" aria-hidden="true"></i></button>
    <main class="auth-card auth-card-login px-10 py-12">
      <header class="auth-card-header text-center">
        <a href="./index.html"><img src="assets/images/gabsweb-cashflow-logo.png" alt="Gabsweb CashFlow Logo" class="brand-logo mx-auto size-10 sm:size-16" /><h1>Forgot Your Password?</h1></a>
        <p>No worries. Enter the email address associated with your Gabsweb CashFlow account and we'll send you instructions to reset your password.</p>
      </header>
      <form class="auth-form" data-auth-form="reset-request" novalidate>
        <div class="auth-field"><label for="email">Email address</label><div class="auth-control"><i data-lucide="mail" class="auth-icon w-4 h-4" aria-hidden="true"></i><input id="email" type="email" placeholder="Enter your email" autocomplete="email" required /></div></div>
        <button type="submit" class="auth-submit btn-primary transition">Send Reset Link</button>
        <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-footer"><a href="./login.html">Back to Sign In</a></p>
    </main>
    <script src="assets/js/auth.js"></script><script>if (window.lucide) window.lucide.createIcons();</script>
  </body>
</html>
