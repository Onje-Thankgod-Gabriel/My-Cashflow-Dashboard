<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabsweb CashFlow - Create a New Password</title><link rel="icon" href="assets/images/fav.png" />
    <script src="https://unpkg.com/lucide@1.64.0/dist/umd/lucide.js"></script><link href="assets/css/index.css" rel="stylesheet" /><link href="assets/css/auth.css" rel="stylesheet" />
      <link href="assets/css/typography.css" rel="stylesheet" />
  </head>
  <body class="auth-page flex items-center justify-center relative">
    <button id="theme-toggle" class="auth-theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false"><i data-lucide="sun" aria-hidden="true"></i></button>
    <main class="auth-card auth-card-login px-10 py-12">
      <header class="auth-card-header text-center"><a href="./index.html"><img src="assets/images/gabsweb-cashflow-logo.png" alt="Gabsweb CashFlow Logo" class="brand-logo mx-auto size-10 sm:size-16" /><h1>Create a New Password</h1></a><p>Choose a strong new password for your Gabsweb CashFlow account.</p></header>
      <form class="auth-form" data-auth-form="reset-confirm" novalidate>
        <div class="auth-field"><label for="password">New password</label><div class="auth-control"><i data-lucide="lock" class="auth-icon w-4 h-4" aria-hidden="true"></i><input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required /><button type="button" class="auth-toggle" data-password-toggle aria-controls="password" aria-label="Show password"><i data-lucide="eye" class="w-4 h-4" aria-hidden="true"></i></button></div></div>
        <div class="auth-field"><label for="password-confirmation">Confirm new password</label><div class="auth-control"><i data-lucide="lock-keyhole" class="auth-icon w-4 h-4" aria-hidden="true"></i><input id="password-confirmation" type="password" placeholder="Repeat your password" autocomplete="new-password" required /><button type="button" class="auth-toggle" data-password-toggle aria-controls="password-confirmation" aria-label="Show password"><i data-lucide="eye" class="w-4 h-4" aria-hidden="true"></i></button></div></div>
        <p class="auth-password-hint">Use at least 8 characters with a mix of letters, numbers, and symbols.</p>
        <button type="submit" class="auth-submit btn-primary transition">Reset Password</button><p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      </form>
      <section class="auth-reset-invalid" hidden><h2>This reset link is invalid or has expired.</h2><p>Request a new password-reset link to continue.</p><a href="./password-reset.html" class="btn-secondary auth-reset-link">Request Another Link</a></section>
    </main>
    <script src="assets/js/auth.js"></script><script>if (window.lucide) window.lucide.createIcons();</script>
  </body>
</html>
